name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group dev
      - name: Tests
        run: uv run python -m pytest -v
      - name: Console script
        run: uv run typesafe --help
      - name: install.sh syntax
        run: bash -n install.sh

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Check dist
        run: |
          ls -l dist
          uv run --with hatchling python -c "import pathlib; files=list(pathlib.Path('dist').iterdir()); assert any(p.suffix=='.whl' for p in files); assert any(p.name.endswith('.tar.gz') for p in files)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
