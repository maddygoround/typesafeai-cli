[project]
name = "typesafeai-cli"
version = "0.2.0"
description = "CLI for TypeSafe System One (Jev)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.6.0",
    "typer>=0.12",
]

[project.scripts]
typesafe = "typesafe_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_cli"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
