[project]
name = "typesafeai-cli2"
version = "0.4.0a0"
description = "Safer decision-maker CLI for TypeSafe System One (Jev). Binary typesafe2; install beside typesafe."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "safeaiforeveryone" }]
keywords = ["typesafe", "jev", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "typesafe-sdk>=0.6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/maddygoround/typesafeai-cli"
Repository = "https://github.com/maddygoround/typesafeai-cli"
Issues = "https://github.com/maddygoround/typesafeai-cli/issues"
Releases = "https://github.com/maddygoround/typesafeai-cli/releases"

[project.scripts]
typesafe2 = "typesafe_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/install.sh",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
